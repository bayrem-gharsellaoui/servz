name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          - native_sim
          - nucleo_u575zi_q

    steps:
      - name: Checkout servz
        uses: actions/checkout@v4
        with:
          path: servz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: servz
          toolchains: arm-zephyr-eabi
          sdk-version: 1.0.1

      - name: Build sample
        working-directory: servz
        run: |
          west build -b ${{ matrix.board }} samples/basic
